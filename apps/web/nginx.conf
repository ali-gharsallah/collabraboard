# SPA O-Live — sert le build Vite ; toute route inconnue retombe sur index.html (routeur client).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Les assets hachés Vite sont immuables.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
