services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: olive, POSTGRES_PASSWORD: olive, POSTGRES_DB: olive }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U olive"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: olive, MINIO_ROOT_PASSWORD: olive-secret }
    ports: ["9000:9000","9001:9001"]
    volumes: [minio:/data]
volumes: { pgdata: {}, minio: {} }
